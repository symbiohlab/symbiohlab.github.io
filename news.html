<header class="phead"><div class="wrap"><h1>소식</h1>
  <p>논문 게재, 수상, 과제 선정, 새로운 구성원 소식을 기록합니다.</p></div></header>
<section><div class="wrap">
  <div class="btns" style="margin-bottom:30px">
    <a class="b3" href="https://symbiohlab.blogspot.com">연구실 블로그 →</a></div>
  <div class="newsl newsfull" style="grid-template-columns:1fr" id="all"></div>
</div></section>
<script src="content.js"></script>
<script>
function el(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;}
function ymd(s){var p=(s||'').split('.');return {y:p[0]||'',m:p[1]||'00',d:p[2]||'00'};}
var MON=['','JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

function newsCards(host, n){
  var t=document.getElementById(host); if(!t) return;
  NEWS.slice(0,n).forEach(function(x){
    var v=ymd(x[0]), mi=parseInt(v.m,10)||0;
    t.appendChild(el('<div class="ni"><div class="d"><b>'+(v.d==='00'?'–':v.d)+'</b><span>'+
      (MON[mi]||v.y)+'</span></div><div class="t">'+x[1]+
      (x[2]?'<span>'+x[2]+'</span>':'')+'</div></div>'));
  });
}
function newsAll(host){
  var t=document.getElementById(host); if(!t) return;
  NEWS.forEach(function(x){
    t.appendChild(el('<div class="ni"><div class="d">'+x[0].replace(/\.00/g,'')+
      '</div><div class="t">'+x[1]+(x[2]?'<span>'+x[2]+'</span>':'')+'</div></div>'));
  });
}
function pubList(host, filterNos){
  var t=document.getElementById(host); if(!t) return;
  var rows = filterNos ? filterNos.map(function(n){
        return PUBLICATIONS.filter(function(p){return p[0]===n;})[0];}).filter(Boolean)
      : PUBLICATIONS;
  var lastY=null;
  rows.forEach(function(p){
    if(!filterNos && p[1]!==lastY){ lastY=p[1]; t.appendChild(el('<div class="yr">'+p[1]+'</div>')); }
    t.appendChild(el('<div class="pub"><div class="no">'+(filterNos?'':p[0])+
      '</div><div><div class="ti">'+p[3]+'</div><div class="au">'+p[2]+
      '</div><div class="ve">'+p[4]+'</div></div></div>'));
  });
}
function memberCards(host){
  var t=document.getElementById(host); if(!t) return;
  MEMBERS.forEach(function(m){
    t.appendChild(el('<div class="pcard"><div class="ph">사진</div><b>'+m[0]+
      '</b><span>'+m[2]+(m[3]?'<br>'+m[3]:'')+'</span></div>'));
  });
}
function memberRows(host){
  var t=document.getElementById(host); if(!t) return;
  MEMBERS.forEach(function(m){
    t.appendChild(el('<div class="row"><div class="k">'+m[0]+' <span style="color:#8b9490;font-weight:400">'+
      m[1]+'</span></div><div class="v">'+m[2]+(m[3]?' · '+m[3]:'')+'</div></div>'));
  });
}
function alumniRows(host){
  var t=document.getElementById(host); if(!t) return;
  ALUMNI.forEach(function(a){
    t.appendChild(el('<div class="row"><div class="k">'+a[0]+' <span style="color:#8b9490;font-weight:400">'+
      a[1]+'</span></div><div class="v">'+a[2]+' → '+a[3]+'</div></div>'));
  });
}
</script>
